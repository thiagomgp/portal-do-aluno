<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Digital - Módulo 1: Hardware, Software e Licenciamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            suppressWarning: true,
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between antialiased">

    <!-- SUPABASE & TRATAMENTO DA SESSÃO -->
    <script>
        const SUPABASE_URL = 'https://iivgusjzerzqrdgctcvo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpdmd1c2p6ZXJ6cXJkZ2N0Y3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0Nzg5NzksImV4cCI6MjEwOTA1NDk3OX0.ewJXSEfaCRGOT9SKiggf6pbrieDNOPgdG39pEoRa5Qc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentStudent = null;
        const MODULE_ID = "intro_hw_sw";
        const TOTAL_STEPS = 4;
        const DEFAULT_UUID_DEMO = "00000000-0000-0000-0000-000000000001";

        function isUUIDValido(str) {
            return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const saved = sessionStorage.getItem('active_student');
            
            if (saved) {
                currentStudent = JSON.parse(saved);
            } else if (urlParams.has('id')) {
                const rawId = urlParams.get('id');
                currentStudent = {
                    id: isUUIDValido(rawId) ? rawId : DEFAULT_UUID_DEMO,
                    nome: urlParams.get('nome') || 'Aluno Demo',
                    turma: urlParams.get('turma') || 'Geral'
                };
            } else {
                currentStudent = {
                    id: DEFAULT_UUID_DEMO,
                    nome: "Aluno Demo",
                    turma: "Geral"
                };
            }

            if (!isUUIDValido(currentStudent.id)) {
                currentStudent.id = DEFAULT_UUID_DEMO;
            }

            document.getElementById('student-name-display').innerText = currentStudent.nome || "Aluno";
            document.getElementById('student-class-display').innerText = currentStudent.turma || "Geral";

            await carregarProgressoExistente();
            startTimer();
        });
    </script>

    <!-- CABEÇALHO SUPERIOR -->
    <header class="bg-slate-900 border-b border-emerald-500/20 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <a href="javascript:history.back();" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl font-bold transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="font-bold text-lg text-emerald-400">Cultura Digital <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30">Módulo 1</span></h1>
                    <p class="text-xs text-slate-400">Teoria Aprofundada & Diagnóstico Técnico</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-slate-300">
                    <i class="fa-solid fa-user-graduate text-emerald-400"></i>
                    <span id="student-name-display" class="font-bold">--</span>
                    <span class="text-slate-600">|</span>
                    <span id="student-class-display" class="text-slate-400">--</span>
                </div>
                <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-400">
                    <i class="fa-solid fa-trophy mr-1"></i><span id="xp-counter">0 XP</span>
                </div>
                <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-xs font-semibold text-emerald-400">
                    <i class="fa-solid fa-clock mr-1"></i><span id="timer-display">00:00</span>
                </div>
            </div>
        </div>
        <div class="w-full bg-slate-950 h-1.5">
            <div id="top-progress-bar" class="bg-emerald-500 h-1.5 w-0 transition-all duration-500"></div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col shadow-xl min-h-[580px]">
            <div class="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold uppercase text-emerald-400">Tópico <span id="current-step-num">1</span> de 4</span>
                    <h2 id="step-title" class="text-lg font-bold text-white">Carregando Teoria...</h2>
                </div>
                <span id="step-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded-md">Fundamentação</span>
            </div>

            <div class="p-5 flex-1 overflow-y-auto space-y-4 text-slate-300 text-xs sm:text-sm leading-relaxed" id="step-content"></div>

            <div class="p-4 bg-slate-900 border-t border-slate-800 flex items-center justify-between gap-3">
                <div id="step-feedback" class="text-xs font-medium text-slate-400">
                    <i class="fa-solid fa-circle-info"></i> Resolva o desafio ao lado.
                </div>
                <button id="next-btn" onclick="nextStep()" disabled class="disabled:opacity-50 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 transition-all">
                    <span>Próximo Tópico</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col shadow-2xl min-h-[580px] p-6">
            <h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-microchip text-emerald-400"></i>
                <span>Laboratório de Classificação e Diagnóstico Técnico</span>
            </h3>
            <div id="interactive-container" class="flex-1 flex flex-col justify-center gap-4"></div>
        </section>
    </main>

    <!-- MODAL CONCLUSÃO -->
    <div id="completion-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500/20 border-2 border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-award"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-white">Módulo Concluído!</h3>
            <p class="text-slate-300 text-sm">Você concluiu com sucesso todos os tópicos deste módulo.</p>
            <button onclick="history.back()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl text-sm">Concluir e Voltar</button>
        </div>
    </div>

    <script>
        const LESSON_STEPS = [
            {
                id: 1,
                title: "Arquitetura: Hardware, Software e Firmware",
                badge: "Teoria & Análise",
                content: `<p class="font-semibold text-white">1. Hardware:</p><p>Componentes físicos tangíveis do computador.</p><p class="font-semibold text-white mt-2">2. Software:</p><p>Instruções lógicas e programas.</p>`,
                xp: 25,
                items: [
                    { name: "Controlador de barramento PCIe", answer: "Hardware", options: ["Hardware", "Software"] },
                    { name: "Rotina UEFI na memória Flash", answer: "Software", options: ["Hardware", "Software"] }
                ]
            },
            {
                id: 2,
                title: "Periféricos e Topologia I/O",
                badge: "Fluxo de Dados",
                content: `<p class="font-semibold text-white">Dispositivos de Entrada e Saída:</p><p>Capturam ou traduzem dados para o usuário ou processador.</p>`,
                xp: 25,
                items: [
                    { name: "Mesa Digitalizadora", answer: "Entrada", options: ["Entrada", "Saída"] },
                    { name: "Display Braille", answer: "Saída", options: ["Entrada", "Saída"] }
                ]
            },
            {
                id: 3,
                title: "Licenças CC & GPL",
                badge: "Ética",
                content: `<p class="font-semibold text-white">Creative Commons x GPL:</p><p>Licenciamento aberto de mídia vs software livre.</p>`,
                xp: 25,
                items: [
                    { name: "Código do Kernel Linux", answer: "GNU / GPL", options: ["Creative Commons (CC)", "GNU / GPL"] }
                ]
            },
            {
                id: 4,
                title: "Consolidação e Diagnóstico",
                badge: "Avaliação",
                content: `<p class="font-semibold text-white">Revisão Final:</p><p>Responda para finalizar o módulo de introdução.</p>`,
                xp: 25,
                items: [
                    { name: "Driver Wi-Fi", answer: "Software", options: ["Hardware", "Software"] }
                ]
            }
        ];

        let currentStepIndex = 0;
        let totalXP = 0;
        let secondsElapsed = 0;
        let timerInterval = null;
        let currentItemIndex = 0;

        async function carregarProgressoExistente() {
            if (!currentStudent || !currentStudent.id) {
                renderStep(0);
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('se_progresso')
                    .select('*')
                    .eq('aluno_id', currentStudent.id)
                    .eq('modulo_id', MODULE_ID)
                    .maybeSingle();

                if (data && !error) {
                    secondsElapsed = data.tempo_segundos || 0;
                    const etapaSalva = Math.max(0, (data.etapa_atual || 1) - 1);
                    currentStepIndex = Math.min(etapaSalva, TOTAL_STEPS - 1);
                    totalXP = currentStepIndex * 25;

                    document.getElementById('xp-counter').innerText = `${totalXP} XP`;
                }
            } catch (err) {
                console.error("Erro ao carregar progresso:", err);
            } finally {
                renderStep(currentStepIndex);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function renderStep(index) {
            const step = LESSON_STEPS[index];
            currentItemIndex = 0;
            document.getElementById('current-step-num').innerText = step.id;
            document.getElementById('step-title').innerText = step.title;
            document.getElementById('step-badge').innerText = step.badge;
            document.getElementById('step-content').innerHTML = step.content;

            const progressPercent = ((index + 1) / LESSON_STEPS.length) * 100;
            document.getElementById('top-progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('next-btn').disabled = true;
            document.getElementById('step-feedback').innerHTML = `<i class="fa-solid fa-circle-info"></i> Responda aos itens ao lado.`;

            loadCurrentItem();
            saveProgressToSupabase(index + 1);
        }

        function loadCurrentItem() {
            const step = LESSON_STEPS[currentStepIndex];
            const container = document.getElementById('interactive-container');
            
            if (currentItemIndex >= step.items.length) {
                container.innerHTML = `
                    <div class="p-8 bg-slate-950 border border-emerald-500/40 rounded-xl text-center space-y-3">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-4xl"></i>
                        <h4 class="font-bold text-white text-lg">Tópico Teórico Concluído!</h4>
                    </div>
                `;
                unlockNextStep();
                return;
            }

            const currentItem = step.items[currentItemIndex];
            let buttonsHTML = currentItem.options.map(opt => `
                <button onclick="verifyAnswer('${opt}', '${currentItem.answer}')" class="p-4 bg-slate-950 border border-slate-800 hover:border-emerald-500 rounded-xl text-center text-slate-200 font-bold text-sm transition">
                    ${opt}
                </button>
            `).join('');

            container.innerHTML = `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 space-y-6 text-center">
                    <span class="text-xs uppercase text-emerald-400 font-bold">Questão ${currentItemIndex + 1} de ${step.items.length}</span>
                    <div class="text-base font-extrabold text-white bg-slate-900 p-4 rounded-lg border border-slate-800">
                        "${currentItem.name}"
                    </div>
                    <div class="grid grid-cols-2 gap-3">${buttonsHTML}</div>
                </div>
            `;
        }

        function verifyAnswer(selected, correct) {
            if (selected === correct) {
                currentItemIndex++;
                loadCurrentItem();
            } else {
                alert("Resposta incorreta. Tente novamente.");
            }
        }

        function unlockNextStep() {
            totalXP += LESSON_STEPS[currentStepIndex].xp;
            document.getElementById('xp-counter').innerText = `${totalXP} XP`;
            document.getElementById('next-btn').disabled = false;
            document.getElementById('step-feedback').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Desafio concluído! Clique em Próximo Tópico.`;
            saveProgressToSupabase(currentStepIndex + 1);
        }

        async function nextStep() {
            if (currentStepIndex < LESSON_STEPS.length - 1) {
                currentStepIndex++;
                renderStep(currentStepIndex);
            } else {
                clearInterval(timerInterval);
                document.getElementById('top-progress-bar').style.width = '100%';
                document.getElementById('completion-modal').classList.remove('hidden');
                await saveProgressToSupabase(TOTAL_STEPS, 'concluido');
            }
        }

        // LÓGICA SEM UPSERT QUE EVITA ERRO 409 CONFLICT
        async function saveProgressToSupabase(stepNumber, status = 'em_andamento') {
            if (!currentStudent || !currentStudent.id) return;

            try {
                const payload = {
                    aluno_id: currentStudent.id,
                    modulo_id: MODULE_ID,
                    etapa_atual: stepNumber,
                    total_etapas: TOTAL_STEPS,
                    status: status,
                    tempo_segundos: secondsElapsed,
                    updated_at: new Date().toISOString()
                };

                // 1. Consulta para checar se já existe no banco
                const { data: existente } = await _supabase
                    .from('se_progresso')
                    .select('id')
                    .eq('aluno_id', currentStudent.id)
                    .eq('modulo_id', MODULE_ID)
                    .maybeSingle();

                if (existente) {
                    // 2. Se já existe, atualiza
                    await _supabase
                        .from('se_progresso')
                        .update(payload)
                        .eq('aluno_id', currentStudent.id)
                        .eq('modulo_id', MODULE_ID);
                } else {
                    // 3. Se é novo, insere
                    await _supabase
                        .from('se_progresso')
                        .insert([payload]);
                }
            } catch (err) {
                console.error("Erro ao salvar progresso:", err);
            }
        }
    </script>
</body>
</html>
