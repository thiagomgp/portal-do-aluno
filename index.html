<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Aluno - Cultura Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  <script>
    tailwind.config = {
      suppressWarning: true,
      theme: {
        extend: {
          colors: {
            emerald: { 400: '#34d399', 500: '#10b981' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- CABEÇALHO SUPERIOR -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="text-lg font-bold text-emerald-400">Portal do Aluno</h1>
      </div>

      <div class="flex items-center gap-4">
        <div id="user-info-bar" class="text-xs text-slate-300 flex items-center gap-2">
          <span>👋 Olá, <strong id="student-display-name" class="text-white">--</strong></span>
          <span class="text-slate-600">|</span>
          <span id="student-display-class" class="text-slate-400">--</span>
        </div>
        <button onclick="fazerLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 px-3 py-1.5 rounded-lg transition">
          Sair
        </button>
      </div>
    </div>
  </header>

  <!-- BARRA DE NAVEGAÇÃO DE ABAS DA PÁGINA -->
  <div class="bg-slate-900/60 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 flex gap-2 py-2 overflow-x-auto">
      <button id="btn-nav-aulas" onclick="mudarAbaPortal('aulas')" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 shadow transition flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap"></i> Aulas Interativas
      </button>
      <button id="btn-nav-perfil" onclick="mudarAbaPortal('perfil')" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-user-gear"></i> Meu Perfil & Configurações
      </button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1">

    <!-- SEÇÃO 1: AULAS INTERATIVAS (VARREDURA AUTOMÁTICA) -->
    <section id="secao-aulas" class="space-y-6">
      <div>
        <h2 class="text-xl font-extrabold text-white flex items-center gap-2">
          <i class="fa-solid fa-book-open text-emerald-400"></i>
          <span>Aulas e Desafios Práticos</span>
        </h2>
        <p class="text-xs text-slate-400 mt-1">Selecione uma das atividades disponíveis para iniciar seu aprendizado na nuvem.</p>
      </div>

      <!-- GRID DE CARDS DE AULAS DETECTADAS -->
      <div id="grid-aulas-automaticas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full p-8 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-2xl">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-400 mb-2"></i>
          <p class="text-xs">Identificando aulas na pasta 'aulainterativa'...</p>
        </div>
      </div>
    </section>

    <!-- SEÇÃO 2: PERFIL & CONFIGURAÇÕES COMPLETO -->
    <section id="secao-perfil" class="hidden max-w-2xl mx-auto space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
        
        <div class="flex items-center gap-4 border-b border-slate-800 pb-6">
          <img id="profile-avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Aluno" alt="Avatar" class="w-16 h-16 rounded-full bg-slate-950 border-2 border-emerald-400 object-cover">
          <div>
            <h3 id="profile-header-name" class="text-lg font-bold text-white">--</h3>
            <p id="profile-header-email" class="text-xs text-slate-400">--</p>
          </div>
        </div>

        <!-- FORMULÁRIO DE DADOS PESSOAIS E AVATAR -->
        <form id="form-update-profile" class="space-y-4">
          <h4 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Alterar Dados Pessoais & Foto</h4>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nome de Exibição / Apelido:</label>
            <input type="text" id="profile-name-input" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs focus:outline-none focus:border-emerald-400" placeholder="Como quer ser chamado..." required>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">URL da Imagem de Perfil (Opcional):</label>
            <input type="url" id="profile-avatar-url" oninput="previewAvatarUrl(this.value)" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs focus:outline-none focus:border-emerald-400" placeholder="https://exemplo.com/minha-foto.png">
          </div>

          <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition">
            Guardar Dados
          </button>
        </form>

        <hr class="border-slate-800">

        <!-- FORMULÁRIO DE ALTERAÇÃO DE SENHA -->
        <form id="form-update-password" class="space-y-4">
          <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Alterar Senha de Acesso</h4>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nova Senha:</label>
            <input type="password" id="profile-new-password" minlength="6" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs focus:outline-none focus:border-amber-400" placeholder="Mínimo 6 caracteres" required>
          </div>

          <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition">
            Atualizar Senha
          </button>
        </form>

      </div>
    </section>

  </main>

  <!-- SUPABASE E MOTOR DE LÓGICA DO PORTAL -->
  <script>
    const SUPABASE_URL = 'https://iivgusjzerzqrdgctcvo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpdmd1c2p6ZXJ6cXJkZ2N0Y3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0Nzg5NzksImV4cCI6MjEwOTA1NDk3OX0.ewJXSEfaCRGOT9SKiggf6pbrieDNOPgdG39pEoRa5Qc';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeStudent = null;

    document.addEventListener('DOMContentLoaded', async () => {
      recuperarSessaoAluno();
      await varrerEExibirAulasGitHub();

      // Submit Dados Pessoais
      document.getElementById('form-update-profile').addEventListener('submit', async (e) => {
        e.preventDefault();
        const novoNome = document.getElementById('profile-name-input').value.trim();
        const novaFoto = document.getElementById('profile-avatar-url').value.trim();

        if (!activeStudent || !activeStudent.id) return;

        const { error } = await _supabase
          .from('profiles')
          .update({ 
            nome_completo: novoNome,
            foto_url: novaFoto || null
          })
          .eq('id', activeStudent.id);

        if (error) alert("Erro ao atualizar dados: " + error.message);
        else {
          alert("Perfil atualizado com sucesso!");
          activeStudent.nome = novoNome;
          if (novaFoto) activeStudent.foto_url = novaFoto;
          sessionStorage.setItem('active_student', JSON.stringify(activeStudent));
          recuperarSessaoAluno();
        }
      });

      // Submit Senha
      document.getElementById('form-update-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        const novaSenha = document.getElementById('profile-new-password').value;

        const { error } = await _supabase.auth.updateUser({ password: novaSenha });

        if (error) alert("Erro ao alterar senha: " + error.message);
        else {
          alert("Senha alterada com sucesso!");
          document.getElementById('profile-new-password').value = '';
        }
      });
    });

    function recuperarSessaoAluno() {
      const saved = sessionStorage.getItem('active_student');
      if (saved) {
        activeStudent = JSON.parse(saved);
        document.getElementById('student-display-name').innerText = activeStudent.nome || 'Aluno';
        document.getElementById('student-display-class').innerText = activeStudent.turma || 'Geral';

        // Preenche campos do Perfil
        document.getElementById('profile-header-name').innerText = activeStudent.nome || 'Aluno';
        document.getElementById('profile-header-email').innerText = activeStudent.email || 'aluno@escola.com';
        document.getElementById('profile-name-input').value = activeStudent.nome || '';
        if (activeStudent.foto_url) {
          document.getElementById('profile-avatar-url').value = activeStudent.foto_url;
          document.getElementById('profile-avatar-preview').src = activeStudent.foto_url;
        }
      }
    }

    function previewAvatarUrl(url) {
      if (url.startsWith('http')) {
        document.getElementById('profile-avatar-preview').src = url;
      }
    }

    // --- VARREDURA AUTOMÁTICA DA PASTA 'aulainterativa' DO GITHUB ---
    async function varrerEExibirAulasGitHub() {
      const grid = document.getElementById('grid-aulas-automaticas');

      try {
        const res = await fetch('https://api.github.com/repos/thiagomgp/portal-do-aluno/contents/aulainterativa');
        const arquivos = await res.json();

        if (!Array.isArray(arquivos)) {
          grid.innerHTML = `<div class="col-span-full p-4 text-center text-rose-400 text-xs">Não foi possível acessar a pasta 'aulainterativa'.</div>`;
          return;
        }

        const arquivosHtml = arquivos.filter(f => f.name.endsWith('.html')).sort((a, b) => a.name.localeCompare(b.name));

        grid.innerHTML = arquivosHtml.map((file, index) => {
          // Formatação automática do título a partir do arquivo
          let tituloFormatted = file.name
            .replace('.html', '')
            .replace(/_/g, ' ')
            .replace(/-/g, ' ')
            .toUpperCase();

          return `
            <div class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-5 rounded-2xl shadow-lg transition flex flex-col justify-between space-y-4">
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded border border-emerald-500/20">
                    Atividade ${index + 1}
                  </span>
                  <i class="fa-solid fa-laptop-code text-slate-600"></i>
                </div>
                <h3 class="font-bold text-white text-base leading-snug">${tituloFormatted}</h3>
                <p class="text-xs text-slate-400 font-mono">/aulainterativa/${file.name}</p>
              </div>

              <button onclick="acessarModulo('aulainterativa/${file.name}')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                <span>Iniciar Atividade</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Erro na varredura:", err);
        grid.innerHTML = `<div class="col-span-full p-4 text-center text-rose-400 text-xs">Erro ao varrer repositório do GitHub.</div>`;
      }
    }

    function acessarModulo(caminhoArquivo) {
      if (activeStudent) {
        window.location.href = `${caminhoArquivo}?id=${activeStudent.id}&nome=${encodeURIComponent(activeStudent.nome)}&turma=${encodeURIComponent(activeStudent.turma || '')}`;
      } else {
        window.location.href = caminhoArquivo;
      }
    }

    function mudarAbaPortal(aba) {
      document.getElementById('secao-aulas').classList.toggle('hidden', aba !== 'aulas');
      document.getElementById('secao-perfil').classList.toggle('hidden', aba !== 'perfil');

      document.getElementById('btn-nav-aulas').className = aba === 'aulas'
        ? 'px-4 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 shadow transition flex items-center gap-2'
        : 'px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition flex items-center gap-2';

      document.getElementById('btn-nav-perfil').className = aba === 'perfil'
        ? 'px-4 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 shadow transition flex items-center gap-2'
        : 'px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition flex items-center gap-2';
    }

    function fazerLogout() {
      sessionStorage.removeItem('active_student');
      window.location.reload();
    }
  </script>
</body>
</html>
