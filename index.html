<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Aluno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navegação Superior -->
  <nav class="p-4 bg-slate-900 border-b border-emerald-500/20 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold text-emerald-400 tracking-wide">Portal do Aluno</h1>
    </div>
    <div id="user-info" class="text-sm text-slate-300"></div>
  </nav>

  <main class="container mx-auto p-6 flex-1 flex flex-col justify-center">

    <!-- ÁREA DE AUTENTICAÇÃO -->
    <section id="auth-section" class="max-w-md w-full mx-auto bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
      <div class="flex border-b border-slate-800 mb-6">
        <button id="btn-tab-login" type="button" onclick="toggleAuthMode('login')" class="flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-500 transition">Entrar</button>
        <button id="btn-tab-register" type="button" onclick="toggleAuthMode('register')" class="flex-1 py-2 font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">Criar Conta</button>
      </div>

      <form id="login-form" onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">E-mail</label>
          <input type="email" id="login-email" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" required>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Senha</label>
          <input type="password" id="login-password" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" required>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold p-3 rounded-lg transition shadow-lg shadow-emerald-900/20">Entrar no Portal</button>
      </form>

      <form id="register-form" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Nome Completo</label>
          <input type="text" id="reg-nome" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" placeholder="Ex: João Silva" required>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Turma</label>
          <select id="reg-turma" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" required>
            <option value="">Selecione sua turma...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">E-mail</label>
          <input type="email" id="reg-email" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" required>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Criar Senha</label>
          <input type="password" id="reg-password" class="w-full p-3 bg-slate-950 rounded-lg border border-slate-800 text-white focus:outline-none focus:border-emerald-500 transition" required minlength="6">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold p-3 rounded-lg transition shadow-lg shadow-emerald-900/20">Cadastrar e Aguardar Aprovação</button>
      </form>
    </section>

    <!-- PAINEL PRINCIPAL DO ALUNO -->
    <div id="app-content" class="hidden space-y-6">
      <nav class="flex gap-2 border-b border-slate-800 pb-3 overflow-x-auto">
        <button id="nav-btn-inicio" type="button" onclick="navigate('inicio')" class="px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-slate-950 shadow-md transition">Início (Mural)</button>
        <button id="nav-btn-disciplinas" type="button" onclick="navigate('disciplinas')" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-900 rounded-lg transition">Disciplinas</button>
        <button id="nav-btn-jogos" type="button" onclick="navigate('jogos')" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-900 rounded-lg transition">Jogos</button>
        <button id="nav-btn-perfil" type="button" onclick="navigate('perfil')" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-900 rounded-lg transition">Perfil</button>
      </nav>

      <section id="tab-inicio" class="space-y-4">
        <h2 class="text-xl font-bold text-emerald-400">Mural de Avisos</h2>
        <div id="lista-avisos" class="grid gap-4"></div>
      </section>

      <section id="tab-disciplinas" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-emerald-400">Minhas Disciplinas (BNCC)</h2>
        <div id="lista-disciplinas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>

      <section id="tab-jogos" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-emerald-400">Jogos Pedagógicos</h2>
        <div id="lista-jogos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
      </section>

      <section id="tab-perfil" class="hidden space-y-6">
        <h2 class="text-xl font-bold text-emerald-400">Meu Perfil</h2>
        <div id="dados-perfil" class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4"></div>
      </section>
    </div>

  </main>

  <!-- MODAL DE LISTAGEM DE CONTEÚDOS (AULAS, MATERIAIS, PROVAS) -->
  <div id="modal-conteudos" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-conteudos-titulo" class="text-lg font-bold text-emerald-400">🎬 Conteúdos da Disciplina</h3>
        <button onclick="fecharModalConteudos()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>
      <div id="lista-itens-conteudo" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function toggleAuthMode(mode) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const btnLogin = document.getElementById('btn-tab-login');
      const btnRegister = document.getElementById('btn-tab-register');

      if (mode === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        btnLogin.className = "flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-500 transition";
        btnRegister.className = "flex-1 py-2 font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        btnRegister.className = "flex-1 py-2 font-semibold text-emerald-400 border-b-2 border-emerald-500 transition";
        btnLogin.className = "flex-1 py-2 font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition";
      }
    }
  </script>
</body>
</html>
